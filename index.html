function loadMobileVersion(){

    const items=MOBILE_PRODUCTS.filter(p=>p.cat===cat).map(p=>`

  mobileCart.push({name,price,emoji});mobileTotal+=price;

  if(mobileCart.length===0){alert("Tu carrito está vacío.");return;}
  alert("Pedido simulado confirmado. Total: RD$"+mobileTotal);

function startGame3D(){
  if(!window.THREE){alert("Three.js no cargó. Revisa la conexión a internet.");return;}
  document.getElementById("startScreen").style.display="none";
  document.getElementById("hud").style.display="block";
  document.getElementById("hint").style.display="block";
  gameStarted=true;init3D();animate();
}

function init3D(){
  scene=new THREE.Scene();scene.background=new THREE.Color(0x172033);
  camera=new THREE.PerspectiveCamera(72,window.innerWidth/window.innerHeight,0.1,1000);
  renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(1);document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,0.95));
  const light=new THREE.DirectionalLight(0xffffff,1);light.position.set(8,18,12);scene.add(light);
  makeFloor();makeWalls();sign("ENTRADA",0,26,0x0f172a);makeCheckout(15,20);
  shelf(-12,10,"FRUTAS");shelf(-5,10,"BEBIDAS");shelf(2,10,"PANADERÍA");areaBox(2,14,"HORNO PANADERÍA",0x92400e);
  shelf(9,10,"CARNICERÍA");areaBox(9,14,"ÁREA CARNICERÍA",0x7f1d1d);
  areaBox(14,4,"PESCADERÍA",0x075985);shelf(-12,3,"LÁCTEOS");shelf(-5,3,"BÁSICOS");shelf(2,3,"LIMPIEZA");
  fridge(-5,-8,"REFRIGERADOR JAMÓN Y QUESOS");areaBox(8,-8,"CAFETERÍA",0x78350f);areaBox(-14,-11,"SERVICIO AL CLIENTE",0x0f766e);areaBox(16,-11,"ACCESO PRIVADO EMPLEADOS",0x334155);
  DATA.forEach(d=>product(d[0],d[1],d[2],d[3],d[4],d[5]));avatar();updateCamera();
  hint("WASD/Flechas para moverte · Q/E para girar · Enter para interactuar");
}

function makeFloor(){const floor=new THREE.Mesh(new THREE.PlaneGeometry(44,58),new THREE.MeshLambertMaterial({color:0xd9d4c8}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new THREE.GridHelper(58,58,0xffffff,0x9ca3af);grid.position.y=.02;scene.add(grid)}
function makeWalls(){box(0,-28,44,.5,3.4,0x111827,1.7);box(0,28,44,.5,3.4,0x111827,1.7);box(-22,0,.5,58,3.4,0x111827,1.7);box(22,0,.5,58,3.4,0x111827,1.7)}
function box(x,z,w,d,h,color,y){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));m.position.set(x,y,z);scene.add(m);return m}
function shelf(x,z,label){box(x,z,6,1.4,1.4,0x7c3f12,.7);box(x,z+.72,6.2,.12,.16,0xfbbf24,1.35);sign(label,x,z+.25,0x111827,2.4)}
function areaBox(x,z,label,color){box(x,z,5.2,2.1,1.25,color,.62);sign(label,x,z+1.35,color,2.2)}
function fridge(x,z,label){box(x,z,7,1.8,2.7,0x38bdf8,1.35);box(x,z+.93,6.4,.08,2,0xdff8ff,1.35);for(let i=0;i<6;i++){box(x-2.5+i,z+.98,.55,.35,.25,i%2?0xfacc15:0xfca5a5,1.35)}sign(label,x,z+.35,0x075985,3.2)}
function makeCheckout(x,z){checkoutBox=box(x,z,5,2.2,1.4,0x020617,.7);box(x,z+.25,4.2,1.1,.15,0x334155,1);box(x,z-.35,1.2,.12,1,0x67e8f9,2);sign("CAJA - PAGAR",x,z+1.8,0x111827,2.8)}
function product(name,price,emoji,x,z,color){const mesh=box(x,z+.35,.65,.55,.55,color,1.85);mesh.userData={name,price,emoji};products.push(mesh);sign(emoji+" "+name,x,z+.95,0x020617,2.55,2.6,.65)}

function avatar(){
  const g=new THREE.Group();scene.add(g);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.34,.43,.95,14),new THREE.MeshLambertMaterial({color:0x111827}));body.position.y=.95;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.28,18,18),new THREE.MeshLambertMaterial({color:0xf1c27d}));head.position.y=1.62;g.add(head);
  const hairMesh=new THREE.Mesh(new THREE.SphereGeometry(.3,18,18),new THREE.MeshLambertMaterial({color:0x111111}));hairMesh.position.y=1.78;hairMesh.scale.set(1.05,.5,1.05);g.add(hairMesh);
  const bang=new THREE.Mesh(new THREE.BoxGeometry(.45,.12,.17),new THREE.MeshLambertMaterial({color:0x111111}));bang.position.set(0,1.67,.25);g.add(bang);
  const leftArm=new THREE.Mesh(new THREE.BoxGeometry(.16,.62,.16),new THREE.MeshLambertMaterial({color:0xf1c27d}));leftArm.position.set(-.48,.95,.12);g.add(leftArm);
  const rightArm=leftArm.clone();rightArm.position.x=.48;g.add(rightArm);
  const leftLeg=new THREE.Mesh(new THREE.BoxGeometry(.18,.6,.18),new THREE.MeshLambertMaterial({color:0x2563eb}));leftLeg.position.set(-.16,.33,0);g.add(leftLeg);
  const rightLeg=leftLeg.clone();rightLeg.position.x=.16;g.add(rightLeg);
  const cartGroup=new THREE.Group();cartGroup.position.set(0,.42,1.45);
  const basket=new THREE.Mesh(new THREE.BoxGeometry(1.25,.55,.95),new THREE.MeshLambertMaterial({color:0xe2e8f0}));basket.position.y=.38;cartGroup.add(basket);
  const hollow=new THREE.Mesh(new THREE.BoxGeometry(.95,.32,.7),new THREE.MeshLambertMaterial({color:0x0f172a}));hollow.position.set(0,.45,.04);cartGroup.add(hollow);
  const handle=new THREE.Mesh(new THREE.BoxGeometry(1.35,.08,.08),new THREE.MeshLambertMaterial({color:0x475569}));handle.position.set(0,.85,-.55);cartGroup.add(handle);
  [[-.48,.04,.39],[.48,.04,.39],[-.48,.04,-.39],[.48,.04,-.39]].forEach(p=>{const wh=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.08,12),new THREE.MeshLambertMaterial({color:0x030712}));wh.rotation.z=Math.PI/2;wh.position.set(p[0],p[1],p[2]);cartGroup.add(wh)});
  g.add(cartGroup);player.avatar=g;player.parts={leftLeg,rightLeg,leftArm,rightArm,cartGroup};
}

function sign(text,x,z,color,y=2.8,w=4,h=.9){const canvas=document.createElement("canvas");canvas.width=512;canvas.height=128;const ctx=canvas.getContext("2d");ctx.fillStyle="rgba(0,0,0,.75)";ctx.fillRect(10,24,492,80);ctx.fillStyle="#fff";ctx.font="bold 30px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,256,64);const texture=new THREE.CanvasTexture(canvas);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true}));sprite.position.set(x,y,z);sprite.scale.set(w,h,1);scene.add(sprite)}
function updateCamera(){const fx=Math.sin(player.rot),fz=Math.cos(player.rot);camera.position.set(player.x-fx*5.3,3.45,player.z-fz*5.3);camera.lookAt(player.x+fx*5,1.85,player.z+fz*5);if(player.avatar){player.avatar.position.set(player.x,0,player.z);player.avatar.rotation.y=player.rot}}
function movePlayer(){const speed=.13,turn=.045;if(keys.turnLeft)player.rot+=turn;if(keys.turnRight)player.rot-=turn;let dx=0,dz=0;const fx=Math.sin(player.rot),fz=Math.cos(player.rot),rx=Math.sin(player.rot-Math.PI/2),rz=Math.cos(player.rot-Math.PI/2);if(keys.forward){dx+=fx*speed;dz+=fz*speed}if(keys.backward){dx-=fx*speed;dz-=fz*speed}if(keys.left){dx+=rx*speed;dz+=rz*speed}if(keys.right){dx-=rx*speed;dz-=rz*speed}const moving=Math.abs(dx)+Math.abs(dz)>0.001;player.x=Math.max(-20,Math.min(20,player.x+dx));player.z=Math.max(-26,Math.min(26,player.z+dz));walk(moving);updateCamera();detect()}
function walk(moving){if(!player.parts)return;const p=player.parts;if(moving){const t=Date.now()*0.012;p.leftLeg.rotation.x=Math.sin(t)*.7;p.rightLeg.rotation.x=-Math.sin(t)*.7;p.leftArm.rotation.x=-Math.sin(t)*.45;p.rightArm.rotation.x=Math.sin(t)*.45;player.avatar.position.y=Math.abs(Math.sin(t))*.04;p.cartGroup.rotation.z=Math.sin(t)*.02}else{p.leftLeg.rotation.x*=.7;p.rightLeg.rotation.x*=.7;p.leftArm.rotation.x*=.7;p.rightArm.rotation.x*=.7;p.cartGroup.rotation.z*=.7}}
function detect(){let nearest=null,dist=2.1;products.forEach(p=>{const d=Math.hypot(p.position.x-player.x,p.position.z-player.z);if(d<dist){dist=d;nearest=p}});const cd=checkoutBox?Math.hypot(checkoutBox.position.x-player.x,checkoutBox.position.z-player.z):999;if(cd<4){currentTarget={type:"checkout"};hint("Estás en CAJA · Enter para pagar");return}if(nearest){currentTarget={type:"product",data:nearest.userData};hint("Producto cerca: "+nearest.userData.emoji+" "+nearest.userData.name+" RD$"+nearest.userData.price+" · Enter")}else{currentTarget=null;hint("WASD/Flechas para moverte · Q/E para girar · Enter para interactuar")}}
function tryInteract(){if(!currentTarget)return;if(currentTarget.type==="checkout"){document.getElementById("modalTitle").textContent="🧾 Caja de pago";document.getElementById("modalText").innerHTML=cart.length?cart.map((p,i)=>`${i+1}. ${p.emoji} ${p.name} - RD$${p.price}`).join("<br>")+`<br><br><b>Total: RD$${total}</b><br><br>Pedido simulado confirmado.`:"Tu carrito está vacío.";document.getElementById("mainBtn").textContent="Finalizar";document.getElementById("modal").style.display="flex";return}const p=currentTarget.data;document.getElementById("modalTitle").textContent=p.emoji+" "+p.name;document.getElementById("modalText").textContent="Precio: RD$"+p.price;document.getElementById("mainBtn").textContent="Agregar";document.getElementById("modal").style.display="flex"}
function mainAction(){if(!currentTarget){closeModal();return}if(currentTarget.type==="checkout"){closeModal();return}const p=currentTarget.data;cart.push({...p});total+=p.price;renderCart();closeModal()}
function renderCart(){document.getElementById("total").textContent=total;document.getElementById("cartList").innerHTML=cart.length?cart.map((p,i)=>`${i+1}. ${p.emoji} ${p.name} - RD$${p.price}`).join("<br>"):"Vacío"}
function closeModal(){document.getElementById("modal").style.display="none"}
function hint(t){document.getElementById("hint").textContent=t}
function animate(){if(!gameStarted)return;requestAnimationFrame(animate);movePlayer();renderer.render(scene,camera)}

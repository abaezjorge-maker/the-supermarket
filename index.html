<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SUPERMARKET 3D (con detección móvil)</title>
    <!--
      Esta plantilla incluye una capa de bloqueo para móviles. Si se detecta un dispositivo
      móvil o una pantalla pequeña, se mostrará un aviso informando que la versión 3D está
      disponible solo en escritorio. Puede redirigir a una versión 2.5D o simplemente
      mostrar este aviso.
    -->
    <style>
      /* Estilo básico para el aviso de móviles */
      #mobileAlert {
        display: none;
        position: fixed;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        background: #020617;
        color: #fff;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        font-size: 1.2rem;
      }
    </style>
</head>
<body>

    <!-- Aviso para usuarios móviles -->
    <div id="mobileAlert">
        <div>
            <p><strong>⚠️ Esta versión 3D solo está disponible en ordenadores.</strong></p>
            <p>En tu teléfono móvil puedes usar la versión 2.5D de la página o visitar el
            sitio más adelante desde un equipo de escritorio.</p>
        </div>
    </div>

    <!--
      Aquí debe ir el contenido de tu página 3D existente (escena, geometrías,
      cámaras, etc.). Copia y pega el contenido de tu archivo actual entre este
      comentario y la etiqueta de cierre </body>. Asegúrate de que todas las
      referencias a Three.js y al código de inicialización sigan funcionando
      correctamente. La función init3DSupermarket se encargará de verificar
      si se debe mostrar el aviso para móviles.
    -->

    <script>
      // Función que detecta si el dispositivo es móvil o la pantalla es pequeña
      function init3DSupermarket() {
        var isMobile = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth < 800;
        if (isMobile) {
          document.getElementById('mobileAlert').style.display = 'flex';
          return;
        }
        // Aquí puedes llamar a tu función de inicialización de la escena 3D existente,
        // por ejemplo: startGame() o init() según el código que ya tengas.
        if (typeof startGame === 'function') {
          startGame();
        }
      }

      // Ejecutar la detección cuando la página se carga
      window.addEventListener('load', init3DSupermarket);
    </script>
</body>
</html>

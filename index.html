<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>THE SUPERMARKET 3D Alpha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{overflow:hidden;background:#050505;color:white}
#startScreen{
  position:fixed;inset:0;z-index:10;background:radial-gradient(circle,#1f2937,#020617);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:25px
}
.startBox{
  max-width:520px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  border-radius:28px;padding:35px;backdrop-filter:blur(16px);box-shadow:0 30px 80px rgba(0,0,0,.45)
}
.startBox h1{font-size:42px;letter-spacing:4px;margin-bottom:10px;color:#67e8f9}
.startBox p{color:#cbd5e1;margin:12px 0;line-height:1.5}
.startBox button{
  margin-top:18px;padding:15px 42px;border:none;border-radius:999px;background:#67e8f9;
  color:#020617;font-weight:900;font-size:18px;cursor:pointer
}
#hud{
  position:fixed;top:15px;left:15px;z-index:5;background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;width:285px;
  backdrop-filter:blur(12px)
}
#hud h2{font-size:18px;margin-bottom:8px;color:#67e8f9}
#cartList{font-size:13px;color:#e2e8f0;line-height:1.45;max-height:160px;overflow-y:auto;margin-top:8px}
#hint{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;
  background:rgba(0,0,0,.75);padding:12px 20px;border-radius:999px;color:#e2e8f0;
  border:1px solid rgba(255,255,255,.12);text-align:center;max-width:92%
}
#crosshair{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:18px;height:18px;border:2px solid rgba(255,255,255,.75);border-radius:50%;z-index:4;pointer-events:none
}
#modal{
  display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);
  align-items:center;justify-content:center;padding:20px
}
.modalBox{
  width:90%;max-width:420px;background:white;color:#020617;border-radius:24px;padding:26px;text-align:center
}
.modalBox h2{margin-bottom:12px}
.modalBox p{margin-bottom:10px}
.modalBox button{
  padding:12px 20px;border:none;border-radius:16px;font-weight:800;cursor:pointer;margin:6px
}
.addBtn{background:#020617;color:white}
.closeBtn{background:#e5e7eb;color:#111827}
#mobileControls{
  position:fixed;right:15px;bottom:75px;z-index:6;display:grid;
  grid-template-columns:repeat(3,54px);gap:8px
}
.ctrl{
  width:54px;height:54px;border:none;border-radius:15px;background:rgba(0,0,0,.68);
  color:white;font-size:24px;border:1px solid rgba(255,255,255,.12)
}
#lookControls{
  position:fixed;left:15px;bottom:75px;z-index:6;display:flex;gap:8px
}
.look{
  width:54px;height:54px;border:none;border-radius:15px;background:rgba(0,0,0,.68);
  color:white;font-size:22px;border:1px solid rgba(255,255,255,.12)
}
@media(min-width:800px){
  #mobileControls,#lookControls{display:none}
}
</style>
</head>
<body>

<div id="startScreen">
  <div class="startBox">
    <h1>THE SUPERMARKET</h1>
    <p>Versión 3D Alpha 0.1</p>
    <p>Camina dentro de un supermercado 3D real. Muévete con WASD o flechas. Mira con A/D o botones. Acércate a productos y presiona E.</p>
    <button onclick="startGame()">ENTRAR</button>
  </div>
</div>

<div id="hud">
  <h2>🛒 Carrito 3D</h2>
  <p>Total: RD$<span id="total">0</span></p>
  <div id="cartList">Vacío</div>
</div>

<div id="crosshair"></div>
<div id="hint">WASD/Flechas para moverte · Q/E o botones para mirar · Acércate a productos</div>

<div id="mobileControls">
  <div></div><button class="ctrl" ontouchstart="press('forward')" ontouchend="release('forward')">▲</button><div></div>
  <button class="ctrl" ontouchstart="press('left')" ontouchend="release('left')">◀</button>
  <button class="ctrl" onclick="tryInteract()">🛒</button>
  <button class="ctrl" ontouchstart="press('right')" ontouchend="release('right')">▶</button>
  <div></div><button class="ctrl" ontouchstart="press('backward')" ontouchend="release('backward')">▼</button><div></div>
</div>

<div id="lookControls">
  <button class="look" ontouchstart="press('turnLeft')" ontouchend="release('turnLeft')">↺</button>
  <button class="look" ontouchstart="press('turnRight')" ontouchend="release('turnRight')">↻</button>
</div>

<div id="modal">
  <div class="modalBox">
    <h2 id="modalTitle"></h2>
    <p id="modalPrice"></p>
    <button class="addBtn" onclick="addCurrentProduct()">Agregar</button>
    <button class="closeBtn" onclick="closeModal()">Cerrar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene,camera,renderer;
let player={x:0,z:18,rot:Math.PI};
let keys={};
let products=[];
let currentProduct=null;
let cart=[];
let total=0;
let gameStarted=false;

const productData=[
  {name:"Manzana",price:35,emoji:"🍎",x:-8,z:5,color:0xef4444},
  {name:"Banana",price:25,emoji:"🍌",x:-7,z:5,color:0xfacc15},
  {name:"Agua",price:30,emoji:"💧",x:-2,z:5,color:0x38bdf8},
  {name:"Jugo",price:75,emoji:"🧃",x:-1,z:5,color:0xfb923c},
  {name:"Pan",price:60,emoji:"🍞",x:4,z:5,color:0xd97706},
  {name:"Café",price:180,emoji:"☕",x:5,z:5,color:0x78350f},
  {name:"Leche",price:95,emoji:"🥛",x:-8,z:-2,color:0xffffff},
  {name:"Queso",price:160,emoji:"🧀",x:-7,z:-2,color:0xfacc15},
  {name:"Pollo",price:280,emoji:"🍗",x:-2,z:-2,color:0xf97316},
  {name:"Carne",price:350,emoji:"🥩",x:-1,z:-2,color:0x991b1b},
  {name:"Arroz",price:180,emoji:"🍚",x:4,z:-2,color:0xf8fafc},
  {name:"Aceite",price:240,emoji:"🛢️",x:5,z:-2,color:0xfbbf24},
  {name:"Detergente",price:230,emoji:"🧴",x:-8,z:-9,color:0x60a5fa},
  {name:"Papel",price:140,emoji:"🧻",x:-7,z:-9,color:0xffffff},
  {name:"Chocolate",price:90,emoji:"🍫",x:-2,z:-9,color:0x5b250b},
  {name:"Galletas",price:85,emoji:"🍪",x:-1,z:-9,color:0xb45309},
  {name:"Helado",price:210,emoji:"🍦",x:4,z:-9,color:0xf9a8d4},
  {name:"Atún",price:95,emoji:"🥫",x:5,z:-9,color:0x94a3b8}
];

function startGame(){
  document.getElementById("startScreen").style.display="none";
  gameStarted=true;
  init3D();
  animate();
}

function init3D(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x111827);
  scene.fog=new THREE.Fog(0x111827,20,65);

  camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  document.body.appendChild(renderer.domElement);

  // Lights
  const ambient=new THREE.AmbientLight(0xffffff,0.55);
  scene.add(ambient);

  const sun=new THREE.DirectionalLight(0xffffff,1.2);
  sun.position.set(12,22,10);
  sun.castShadow=true;
  sun.shadow.mapSize.width=2048;
  sun.shadow.mapSize.height=2048;
  scene.add(sun);

  // Floor
  const floorGeo=new THREE.PlaneGeometry(34,46);
  const floorMat=new THREE.MeshStandardMaterial({color:0xd9d4c8,roughness:.65});
  const floor=new THREE.Mesh(floorGeo,floorMat);
  floor.rotation.x=-Math.PI/2;
  floor.receiveShadow=true;
  scene.add(floor);

  // Tile grid
  const grid=new THREE.GridHelper(46,46,0xffffff,0xb8b3a8);
  grid.position.y=.015;
  scene.add(grid);

  // Walls
  makeWall(0,-23,34,.5,3);
  makeWall(0,23,34,.5,3);
  makeWall(-17,0,.5,46,3);
  makeWall(17,0,.5,46,3);

  // Entrance and checkout
  makeSign("🚪 ENTRADA",0,21.5,0x111827);
  makeCheckout(12,16);

  // Shelves rows
  makeShelf(-7,6,"🍎 FRUTAS / 🧃 BEBIDAS");
  makeShelf(2,6,"🍞 PANADERÍA");
  makeShelf(11,6,"🥩 CARNES");

  makeShelf(-7,-1,"🥛 LÁCTEOS");
  makeShelf(2,-1,"🍚 BÁSICOS");
  makeShelf(11,-1,"🧼 LIMPIEZA");

  makeShelf(-7,-8,"🍫 SNACKS");
  makeFridge(2,-8,"❄️ REFRIGERADOS");
  makeShelf(11,-8,"🥫 ENLATADOS");

  // Products
  productData.forEach(makeProduct);

  // Avatar body visible from behind
  makeAvatar();

  updateCamera();
}

function makeWall(x,z,w,d,h){
  const geo=new THREE.BoxGeometry(w,h,d);
  const mat=new THREE.MeshStandardMaterial({color:0x1f2937,roughness:.7});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(x,h/2,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
}

function makeShelf(x,z,label){
  const group=new THREE.Group();
  group.position.set(x,0,z);

  const base=new THREE.Mesh(
    new THREE.BoxGeometry(6,1.7,1.3),
    new THREE.MeshStandardMaterial({color:0x7c3f12,roughness:.55})
  );
  base.position.y=.85;
  base.castShadow=true;
  base.receiveShadow=true;
  group.add(base);

  const top=new THREE.Mesh(
    new THREE.BoxGeometry(6.2,.18,1.5),
    new THREE.MeshStandardMaterial({color:0x4a2508})
  );
  top.position.y=1.78;
  top.castShadow=true;
  group.add(top);

  const text=createTextSprite(label);
  text.position.set(0,2.35,0);
  group.add(text);

  scene.add(group);
}

function makeFridge(x,z,label){
  const body=new THREE.Mesh(
    new THREE.BoxGeometry(6.5,2.5,1.4),
    new THREE.MeshStandardMaterial({color:0x7dd3fc,roughness:.25,metalness:.1})
  );
  body.position.set(x,1.25,z);
  body.castShadow=true;
  body.receiveShadow=true;
  scene.add(body);

  const glass=new THREE.Mesh(
    new THREE.BoxGeometry(5.8,1.8,.08),
    new THREE.MeshStandardMaterial({color:0xdff8ff,transparent:true,opacity:.55,roughness:.05})
  );
  glass.position.set(x,1.25,z+.73);
  scene.add(glass);

  const text=createTextSprite(label);
  text.position.set(x,3,z);
  scene.add(text);
}

function makeCheckout(x,z){
  const counter=new THREE.Mesh(
    new THREE.BoxGeometry(5,1.4,2.2),
    new THREE.MeshStandardMaterial({color:0x020617,roughness:.45})
  );
  counter.position.set(x,.7,z);
  counter.castShadow=true;
  counter.receiveShadow=true;
  scene.add(counter);

  const screen=new THREE.Mesh(
    new THREE.BoxGeometry(1.2,1,.12),
    new THREE.MeshStandardMaterial({color:0x67e8f9,emissive:0x0e7490,emissiveIntensity:.45})
  );
  screen.position.set(x,2,z-.35);
  screen.castShadow=true;
  scene.add(screen);

  makeSign("CAJA 🧾",x,z+1.5,0x111827);
}

function makeSign(text,x,z,color){
  const sign=new THREE.Mesh(
    new THREE.BoxGeometry(4,.9,.18),
    new THREE.MeshStandardMaterial({color})
  );
  sign.position.set(x,2.8,z);
  sign.castShadow=true;
  scene.add(sign);

  const sprite=createTextSprite(text);
  sprite.position.set(x,2.85,z+.12);
  scene.add(sprite);
}

function makeProduct(p){
  const geo=new THREE.BoxGeometry(.75,.75,.75);
  const mat=new THREE.MeshStandardMaterial({color:p.color,roughness:.4});
  const box=new THREE.Mesh(geo,mat);
  box.position.set(p.x,.75,p.z);
  box.castShadow=true;
  box.receiveShadow=true;
  box.userData=p;
  scene.add(box);

  const label=createTextSprite(p.emoji+" "+p.name+" RD$"+p.price);
  label.position.set(p.x,1.55,p.z);
  scene.add(label);

  products.push(box);
}

function makeAvatar(){
  const group=new THREE.Group();
  group.name="avatar";
  scene.add(group);

  const body=new THREE.Mesh(
    new THREE.CapsuleGeometry(.28,.8,8,16),
    new THREE.MeshStandardMaterial({color:0x111827})
  );
  body.position.y=.85;
  body.castShadow=true;
  group.add(body);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(.27,24,24),
    new THREE.MeshStandardMaterial({color:0xf1c27d})
  );
  head.position.y=1.55;
  head.castShadow=true;
  group.add(head);

  const cart=new THREE.Mesh(
    new THREE.BoxGeometry(.9,.45,.75),
    new THREE.MeshStandardMaterial({color:0xcbd5e1,metalness:.25,roughness:.3})
  );
  cart.position.set(.65,.35,-.15);
  cart.castShadow=true;
  group.add(cart);

  player.avatar=group;
}

function createTextSprite(message){
  const canvas=document.createElement("canvas");
  canvas.width=512;
  canvas.height=128;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,512,128);
  ctx.fillStyle="rgba(0,0,0,.72)";
  ctx.roundRect ? ctx.roundRect(12,22,488,84,22) : ctx.fillRect(12,22,488,84);
  ctx.fill();
  ctx.fillStyle="white";
  ctx.font="bold 34px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(message,256,64);
  const texture=new THREE.CanvasTexture(canvas);
  const material=new THREE.SpriteMaterial({map:texture,transparent:true});
  const sprite=new THREE.Sprite(material);
  sprite.scale.set(3.8,.95,1);
  return sprite;
}

function updateCamera(){
  const eyeHeight=1.7;
  const behind=4.2;
  const forwardX=Math.sin(player.rot);
  const forwardZ=Math.cos(player.rot);

  camera.position.set(
    player.x - forwardX*behind,
    eyeHeight+1.2,
    player.z - forwardZ*behind
  );

  camera.lookAt(
    player.x + forwardX*5,
    eyeHeight,
    player.z + forwardZ*5
  );

  if(player.avatar){
    player.avatar.position.set(player.x,0,player.z);
    player.avatar.rotation.y=player.rot;
  }
}

function movePlayer(){
  const speed=.12;
  const turn=.045;

  if(keys.turnLeft || keys.q) player.rot+=turn;
  if(keys.turnRight || keys.e) player.rot-=turn;

  let dx=0,dz=0;
  const fx=Math.sin(player.rot);
  const fz=Math.cos(player.rot);
  const rx=Math.sin(player.rot-Math.PI/2);
  const rz=Math.cos(player.rot-Math.PI/2);

  if(keys.forward){dx+=fx*speed;dz+=fz*speed}
  if(keys.backward){dx-=fx*speed;dz-=fz*speed}
  if(keys.left){dx+=rx*speed;dz+=rz*speed}
  if(keys.right){dx-=rx*speed;dz-=rz*speed}

  player.x+=dx;
  player.z+=dz;

  player.x=Math.max(-15.5,Math.min(15.5,player.x));
  player.z=Math.max(-21.5,Math.min(21.5,player.z));

  updateCamera();
  detectNearby();
}

function detectNearby(){
  let nearest=null;
  let minDist=1.8;

  products.forEach(obj=>{
    const dist=Math.hypot(obj.position.x-player.x,obj.position.z-player.z);
    if(dist<minDist){
      minDist=dist;
      nearest=obj;
    }
  });

  if(nearest){
    currentProduct=nearest.userData;
    document.getElementById("hint").textContent=
      "Presiona E o 🛒 para agregar: "+currentProduct.emoji+" "+currentProduct.name+" RD$"+currentProduct.price;
  }else{
    currentProduct=null;
    document.getElementById("hint").textContent=
      "WASD/Flechas para moverte · Q/E para mirar · Acércate a productos";
  }
}

function tryInteract(){
  if(currentProduct){
    document.getElementById("modalTitle").textContent=currentProduct.emoji+" "+currentProduct.name;
    document.getElementById("modalPrice").textContent="Precio: RD$"+currentProduct.price;
    document.getElementById("modal").style.display="flex";
  }
}

function addCurrentProduct(){
  if(!currentProduct)return;
  cart.push({...currentProduct});
  total+=currentProduct.price;
  renderCart();
  closeModal();
}

function renderCart(){
  document.getElementById("total").textContent=total;
  const list=document.getElementById("cartList");
  if(cart.length===0){list.innerHTML="Vacío";return}
  list.innerHTML=cart.map((p,i)=>`${i+1}. ${p.emoji} ${p.name} - RD$${p.price}`).join("<br>");
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function animate(){
  if(!gameStarted)return;
  requestAnimationFrame(animate);
  movePlayer();
  renderer.render(scene,camera);
}

document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="w"||e.key==="ArrowUp")keys.forward=true;
  if(k==="s"||e.key==="ArrowDown")keys.backward=true;
  if(k==="a"||e.key==="ArrowLeft")keys.left=true;
  if(k==="d"||e.key==="ArrowRight")keys.right=true;
  if(k==="q")keys.turnLeft=true;
  if(k==="e"){
    if(currentProduct) tryInteract();
    else keys.turnRight=true;
  }
});

document.addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(k==="w"||e.key==="ArrowUp")keys.forward=false;
  if(k==="s"||e.key==="ArrowDown")keys.backward=false;
  if(k==="a"||e.key==="ArrowLeft")keys.left=false;
  if(k==="d"||e.key==="ArrowRight")keys.right=false;
  if(k==="q")keys.turnLeft=false;
  if(k==="e")keys.turnRight=false;
});

function press(action){keys[action]=true}
function release(action){keys[action]=false}

window.addEventListener("resize",()=>{
  if(!camera||!renderer)return;
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>

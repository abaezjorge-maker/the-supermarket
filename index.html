<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE SUPERMARKET 3D</title>
  <!-- Incluye aquí todos tus estilos CSS y scripts de Three.js según tu versión actual -->
  <style>
    /* Ejemplo de estilos básicos; reemplaza con los de tu proyecto */
    body {
      margin: 0;
      background: #020617;
      color: #fff;
      font-family: sans-serif;
    }
    #canvas3d {
      width: 100%;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body onload="init3DSupermarket()">

  <!-- Contenedor o canvas para Three.js -->
  <canvas id="canvas3d"></canvas>

  <script>
    function init3DSupermarket() {
      // Detectar si el dispositivo es móvil o el ancho de pantalla es pequeño
      const isMobile = /Mobi/i.test(navigator.userAgent) || window.innerWidth < 800;
      if (isMobile) {
        // Redirigir a la versión 2.5 D automáticamente
        window.location.href = "index.html";
        return;
      }

      // A partir de aquí inicializa tu escena Three.js como en tu página original
      // Este bloque debería contener tu código actual: renderer, escena, cámara, etc.
      // Ejemplo mínimo:
      const canvas = document.getElementById('canvas3d');
      const renderer = new THREE.WebGLRenderer({ canvas });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 5);

      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshBasicMaterial({ color: 0x67e8f9 });
      const cube = new THREE.Mesh(geometry, material);
      scene.add(cube);

      function animate() {
        requestAnimationFrame(animate);
        cube.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      animate();
    }

    // Ajustar el tamaño del renderer al redimensionar la ventana
    window.addEventListener('resize', function() {
      // Actualiza el renderer y la cámara si es necesario
    });
  </script>

</body>
</html>
